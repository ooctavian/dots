# panafanpwrd configuration — all defaults are built into the daemon, uncomment to override

[daemon]

# system power profile backend:
#   power-profiles-daemon — follow org.freedesktop.UPower.PowerProfiles
#   manual                — no backend, manual control only
# profile_backend = power-profiles-daemon
#
# directly select the platform by ID, skipping product_name detection
# use this if your model is not auto-detected but uses the same hardware
# platform_id_override = CFSV1-2
#
# allow running on experimental platforms (untested on hardware)
# experimental platforms: CFQV9
# an experimental platform is used only when selected — either auto-detected
# from product_name or chosen via platform_id_override above — AND this is true
# report results to https://todo.sr.ht/~szern/panafanpwr
# allow_experimental = false

# --- power-profiles-daemon backend -------------------------------------------
[power-profile-backend.power-profiles-daemon]

# automatically apply power mode when the system power profile changes
# set to false to query the profile only at startup/reset without subscribing
# follow_system_power_profile = true

# --- CF-SV1 platform profile actions -----------------------------------------
# Override power mode and fan behaviour per system power profile.
# All keys are optional — omit any to keep the platform default.
# fan_profile and fan_speed are mutually exclusive: set one or neither.
#
# [platform.CFSV1-2.profile.performance]
#
# EC power mode (perf or eco)
# power_mode  = perf
#
# fan curve (quiet or cool)
# fan_profile = cool
#
# manual fan speed instead of a curve (0 = release to auto, 100 = full)
# fan_speed   = 0
#
# [platform.CFSV1-2.profile.balanced]
#
# power_mode  = eco
# fan_profile = quiet
#
# [platform.CFSV1-2.profile.power-saver]
#
# power_mode  = eco
# fan_profile = quiet

[platform.CFSV1-2.profile.balanced]
fan_profile = cool

[platform.CFSV1-2.profile.power-saver]
fan_profile = cool
