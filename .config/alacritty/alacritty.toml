[cursor.style]
blinking = "On"
shape = "block"

[env]
TERM = "xterm-256color"

[font]
size = 11

[font.normal]
family = "Adwaita Mono"

[[keyboard.bindings]]
action = "ScrollPageUp"
key = "Up"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollPageDown"
key = "Down"
mods = "Control"

[window]
dynamic_padding = true
dynamic_title = true
