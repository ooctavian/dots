# foot, set up to look like ~/.config/alacritty/alacritty.toml

[main]
term=xterm-256color
font=Adwaita Mono:size=11
# alacritty dynamic_padding: spread leftover space evenly around the grid
pad=0x0 center

[cursor]
style=block
blink=yes

# Gruvbox Material Medium Dark
[colors-dark]
background=282828
foreground=d4be98
regular0=3c3836
regular1=ea6962
regular2=a9b665
regular3=d8a657
regular4=7daea3
regular5=d3869b
regular6=89b482
regular7=d4be98
bright0=3c3836
bright1=ea6962
bright2=a9b665
bright3=d8a657
bright4=7daea3
bright5=d3869b
bright6=89b482
bright7=d4be98

[key-bindings]
scrollback-up-page=Shift+Page_Up Control+Up
scrollback-down-page=Shift+Page_Down Control+Down

[text-bindings]
# Shift+Enter sends ESC + CR, like alacritty
\x1b\x0d=Shift+Return
