backend = "glx";

# Shadow
shadow = false;
shadow-radius = 15;
shadow-offset-x = -15;
shadow-offset-y = -15;
shadow-opacity = 0.7;
fading = false;
fade-in-step = 0.028;
fade-out-step = 0.09;
fade-delta = 10;
fade-exclude = [ "class_g = 'mpv'" ];
inactive-dim-fixed = false;
# inactive-dim = 0.

# Performance
vsync = true;                # sync to the 60Hz refresh: no tearing, no wasted frames
use-damage = true;           # redraw only the parts of the screen that changed
unredir-if-possible = true;  # fullscreen video/games bypass the compositor entirely
